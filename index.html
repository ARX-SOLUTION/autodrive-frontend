  <head>

    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="canonical" href="https://app.automaktab.uz/" />
    <meta name="theme-color" content="#092634" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <title>Auto Maktab CRM | App</title>
    <meta
      name="description"
      content="Auto Maktab CRM ilovasiga kirish. Talabalar, to&#39;lovlar, davomat va dars jadvalini boshqaring."
    />
    <meta name="author" content="Auto Maktab" />

    <meta property="og:title" content="Auto Maktab CRM | App" />
    <meta name="twitter:title" content="Auto Maktab CRM | App" />
    <meta
      property="og:description"
      content="Auto Maktab CRM ilovasiga kirish. Talabalar, to&#39;lovlar, davomat va dars jadvalini boshqaring."
    />
    <meta
      name="twitter:description"
      content="Auto Maktab CRM ilovasiga kirish. Talabalar, to&#39;lovlar, davomat va dars jadvalini boshqaring."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.automaktab.uz/" />
    <meta property="og:site_name" content="Auto Maktab CRM App" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:image" content="https://automaktab.uz/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Auto Maktab CRM — avtomaktabingizning har bir so&#39;mi nazoratda"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://automaktab.uz/og-banner.png" />
    <script>
      // Apply theme and saved language before React mounts to avoid FOUC.
      (function () {
        try {
          var lang = (localStorage.getItem('lang') || '').slice(0, 2);
          if (lang === 'uz' || lang === 'ru' || lang === 'en') {
            document.documentElement.lang = lang;
          }
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          var theme =
            stored && stored !== 'system'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <p>
        <strong>Auto Maktab CRM</strong> ilovasi JavaScript talab qiladi. Asosiy
        saytga o&#39;tish uchun
        <a href="https://automaktab.uz/">automaktab.uz</a> manzilini oching.
      </p>
    </noscript>
    <script type="module">
      const path = location.pathname.replace(/\/+$/, '') || '/';
      if (path !== '/login') {
        const { ensureI18n } = await import('/src/i18n/ensure.ts');
        await ensureI18n();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
