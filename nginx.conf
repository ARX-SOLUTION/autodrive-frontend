server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        return 200;
    }

    # Hashed Vite build output (assets/*-<hash>.js, assets/*-<hash>.css) — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker must always be revalidated or PWA updates never reach clients.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # index.html must always be revalidated so new deploys (and their asset hashes) are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for react-router-dom BrowserRouter routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
